apply plugin: 'com.android.application'
apply plugin: 'com.google.gms.google-services'
apply plugin: 'com.google.firebase.crashlytics'

import java.text.SimpleDateFormat

repositories {
    mavenCentral()
    google()
}

configurations.configureEach {
    exclude group: 'com.google.firebase', module: 'firebase-core'
    exclude group: 'androidx.recyclerview', module: 'recyclerview'
    exclude group: 'com.android.support', module: 'support-v4'
}

dependencies {
    implementation 'androidx.core:core:1.17.0'
    implementation 'androidx.palette:palette:1.0.0'
    implementation 'androidx.exifinterface:exifinterface:1.4.2'
    implementation 'androidx.dynamicanimation:dynamicanimation:1.1.0'
    implementation "androidx.sharetarget:sharetarget:1.2.0"
    implementation 'com.google.android.gms:play-services-measurement:23.0.0'

    compileOnly 'org.checkerframework:checker-qual:3.53.1'
    compileOnly 'org.checkerframework:checker-compat-qual:2.5.6'

    implementation platform('com.google.firebase:firebase-bom:34.9.0')
    implementation 'com.google.firebase:firebase-crashlytics'
    implementation 'com.google.firebase:firebase-analytics'
    implementation 'com.google.firebase:firebase-messaging:25.0.1'
    implementation 'com.google.firebase:firebase-config:23.0.1'
    implementation 'com.google.firebase:firebase-datatransport:20.0.1'
    implementation 'com.google.firebase:firebase-appindexing:20.0.0'
    implementation 'com.google.android.gms:play-services-maps:20.0.0'
    implementation 'com.google.android.gms:play-services-auth:21.5.0'
    implementation 'com.google.android.gms:play-services-vision:20.1.3'
    implementation 'com.google.android.gms:play-services-wearable:19.0.0'
    implementation 'com.google.android.gms:play-services-location:21.3.0'
    implementation 'com.google.android.gms:play-services-wallet:19.5.0'
    implementation 'com.googlecode.mp4parser:isoparser:1.1.22'
    implementation 'com.stripe:stripe-android:22.7.0'
    implementation 'com.google.mlkit:language-id:17.0.6'
    implementation 'com.android.billingclient:billing:8.3.0'
    implementation 'com.google.code.gson:gson:2.13.2'
    implementation 'com.google.guava:guava:33.5.0-jre'

    def camerax_version = '1.5.3'
    implementation "androidx.camera:camera-camera2:${camerax_version}"
    implementation "androidx.camera:camera-core:${camerax_version}"
    implementation "androidx.camera:camera-extensions:${camerax_version}"
    implementation "androidx.camera:camera-lifecycle:${camerax_version}"
    implementation "androidx.camera:camera-view:${camerax_version}"
    implementation "androidx.camera:camera-video:${camerax_version}"
    implementation 'androidx.interpolator:interpolator:1.0.0'

    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.1.5'

    def room_version = "2.8.4"
    implementation "androidx.room:room-runtime:$room_version"
    annotationProcessor "androidx.room:room-compiler:$room_version"

    implementation "dev.gustavoavila:java-android-websocket-client:2.0.2"
    implementation "com.squareup.okhttp3:okhttp:5.3.2"
    testImplementation 'junit:junit:4.13.2'
}

def isPmBuild = "false"
def abis = [9: 'universal', 1: 'armeabi-v7a', 5: 'arm64-v8a', 2: 'x86', 6: 'x86_64']

android {
    compileSdk 36
    namespace = 'org.telegram.messenger'
    ndkVersion = '27.3.13750724'

    buildFeatures {
        buildConfig true
        viewBinding true
        resValues true
    }

    defaultConfig {
        applicationId "com.clisix.kesgram"
        versionCode Integer.parseInt(APP_VERSION_CODE)
        versionName APP_VERSION_NAME

        minSdk 21
        targetSdk 33

        Properties localProperties = new Properties()
        if (project.rootProject.file('API_KEYS').exists()) {
            localProperties.load(project.rootProject.file('API_KEYS').newDataInputStream())
        }

        buildConfigField 'int', 'APP_ID', localProperties.getProperty("APP_ID", "12345")
        buildConfigField 'String', 'APP_HASH', '"' + localProperties.getProperty("APP_HASH", "0123456789abcdef0123456789abcdef") + '"'
        buildConfigField 'String', 'AYU_VERSION', '"' + new Date().format("yyyyMMdd") + '"'

        resValue 'string', 'MAPS_V2_API', localProperties.getProperty("MAPS_V2_API", "")

        externalNativeBuild {
            cmake {
                version = '3.10.2'
                arguments '-DANDROID_STL=c++_static', '-DANDROID_PLATFORM=android-21'
            }
        }

        javaCompileOptions {
            annotationProcessorOptions {
                arguments += ["room.schemaLocation": "$projectDir/schemas".toString()]
            }
        }
    }

    externalNativeBuild {
        cmake {
            path 'jni/CMakeLists.txt'
        }
    }

    sourceSets {
        main {
            jniLibs.srcDirs = ['jni']
            res.srcDirs = ['src/main/res', 'src/main/res-solar', 'src/main/res-tabs']
        }
    }

    lint {
        checkReleaseBuilds = false
        disable = ['MissingTranslation', 'ExtraTranslation', 'BlockedPrivateApi']
    }

    testOptions {
        unitTests {
            returnDefaultValues = true
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
        coreLibraryDesugaringEnabled true
    }

    signingConfigs {
        release {
            Properties localProperties = new Properties()
            if (project.rootProject.file('API_KEYS').exists()) {
                localProperties.load(project.rootProject.file('API_KEYS').newDataInputStream())
            }
            storeFile file("./kesgram.keystore")
            storePassword localProperties.getProperty("SIGNING_KEY_STORE_PASSWORD")
            keyAlias localProperties.getProperty("SIGNING_KEY_ALIAS")
            keyPassword localProperties.getProperty("SIGNING_KEY_PASSWORD")
        }
    }

    packaging {
        resources {
            excludes += ['META-INF/DEPENDENCIES']
        }
    }

    buildTypes {
        debug {
            debuggable true
            jniDebuggable false
            signingConfig signingConfigs.release
            minifyEnabled false
            shrinkResources false
            multiDexEnabled true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            ndk.debugSymbolLevel = 'FULL'
            buildConfigField "boolean", "DEBUG_VERSION", "true"
            buildConfigField "boolean", "IS_PM_BUILD", isPmBuild
        }

        release {
            debuggable false
            jniDebuggable false
            signingConfig signingConfigs.release
            minifyEnabled true
            shrinkResources true
            multiDexEnabled true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            ndk.debugSymbolLevel = 'FULL'
            buildConfigField "boolean", "DEBUG_VERSION", "false"
            buildConfigField "boolean", "IS_PM_BUILD", isPmBuild
        }
    }

    flavorDimensions "minApi"

    productFlavors {
        armv7 {
            ndk.abiFilters "armeabi-v7a", "arm64-v8a"
            ext.abiVersionCode = 1
        }
        x86 {
            ndk.abiFilters "x86", "x86_64"
            ext.abiVersionCode = 2
        }
        arm64 {
            ndk.abiFilters "arm64-v8a"
            ext.abiVersionCode = 5
        }
        x64 {
            ndk.abiFilters "x86_64"
            ext.abiVersionCode = 6
        }
        afat {
            ndk.abiFilters "armeabi-v7a", "arm64-v8a", "x86", "x86_64"
            sourceSets.release.manifest.srcFile 'config/release/AndroidManifest.xml'
            ext.abiVersionCode = 9
        }
        beta {
            ndk.abiFilters "armeabi-v7a", "arm64-v8a"
            sourceSets.debug.manifest.srcFile 'config/debug/AndroidManifest.xml'
            ext.abiVersionCode = 9
        }
    }

    androidComponents {

        onVariants(selector().all()) { variant ->

            variant.outputs.forEach { output ->

                def flavor = variant.productFlavors[0].second
                def buildTypePrefix = flavor == "beta" ? "beta-" : ""

                def date = new Date()
                def formattedDate = new SimpleDateFormat("ddMMyyyy").format(date)

                def flavorConfig = android.productFlavors.getByName(flavor)
                def abiVersionCode = flavorConfig.ext.abiVersionCode
                def abi = abis.get(abiVersionCode)

                output.outputFileName.set("KESGram-${buildTypePrefix}${abi}-${formattedDate}.apk")

                output.versionCode.set(
                        defaultConfig.versionCode * (isPmBuild == "true" ? 100 : 10) + abiVersionCode
                )
            }
        }

        beforeVariants(selector().all()) { variantBuilder ->

            def flavorNames = variantBuilder.productFlavors.collect { it.second }
            def isBeta = flavorNames.contains("beta")
            def buildType = variantBuilder.buildType

            boolean ignore =
                    (buildType != "debug" && isBeta) ||
                            (buildType != "release" && !isBeta)

            variantBuilder.enable = !ignore
        }
    }

    bundle.language.enableSplit = false
    dependenciesInfo.includeInApk = false
}

configurations.implementation {
    exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk8'
}